<!-- ==== PT DIAG (vaqtinchalik diagnostika) ==== -->
<style type="text/css">
#ptDiagToggle{position:fixed;top:2px;right:2px;z-index:2147483647;background:#003b00;color:#39ff39;border:1px solid #39ff39;font:bold 11px monospace;padding:3px 7px;border-radius:3px}
#ptDiagBox{position:fixed;top:26px;left:0;right:0;z-index:2147483646;background:rgba(0,25,0,.78);color:#39ff39;font:10px/1.35 monospace;padding:4px 6px;white-space:pre;pointer-events:none}
#ptDiagErr{position:fixed;bottom:0;left:0;right:0;z-index:2147483646;background:rgba(45,0,0,.88);color:#ff6666;font:10px/1.35 monospace;padding:4px 6px;max-height:40%;overflow:hidden;white-space:pre-wrap;pointer-events:none}
#ptDiagBox.ptDiagHide,#ptDiagErr.ptDiagHide{display:none}
</style>
<div id="ptDiagBox"></div>
<div id="ptDiagErr"></div>
<button id="ptDiagToggle" type="button">DIAG</button>
<script type="text/javascript">
(function(){
  var box=document.getElementById('ptDiagBox'),
      errBox=document.getElementById('ptDiagErr'),
      btn=document.getElementById('ptDiagToggle'),
      errs=[];

  btn.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    var hide=box.className.indexOf('ptDiagHide')>=0;
    box.className=hide?'':'ptDiagHide';
    errBox.className=box.className;
  },false);

  window.addEventListener('error',function(e){
    if(errs.length<8){
      errs.push((e.message||'x')+' @'+String(e.filename||'').split('/').pop()+':'+e.lineno);
      errBox.textContent='JS ERROR:\n'+errs.join('\n');
    }
  },false);

  function findCircle(){
    if(window.__ptCircle&&window.__ptCircle.getContainer&&window.__ptCircle.getContainer())return window.__ptCircle;
    try{
      var it=Ext.ComponentManager.all?Ext.ComponentManager.all.items:[];
      for(var i=it.length-1;i>=0;i--){
        var c=it[i];
        if(c&&typeof c.getScreenCenter==='function'&&c.getContainer&&c.getContainer())return c;
      }
    }catch(e){}
    return null;
  }

  var lastTap='-',tapN=0,rawTap='-';
  function chain(x,y){
    var out=[],el=document.elementFromPoint(x,y);
    for(var i=0;el&&i<3;i++){
      var cn='';
      try{if(el.className&&typeof el.className==='string')cn='.'+el.className.split(' ').slice(0,2).join('.')}catch(e){}
      out.push(el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+cn);
      el=el.parentElement;
    }
    return out.join(' < ');
  }
  function onTap(cx,cy){
    tapN++;
    lastTap='#'+tapN+'  '+Math.round(cx)+','+Math.round(cy)+'  ->  '+chain(cx,cy);
  }
  document.addEventListener('touchstart',function(e){
    var t=e.changedTouches&&e.changedTouches[0];
    if(t)rawTap=Math.round(t.pageX)+','+Math.round(t.pageY);
  },true);
  document.addEventListener('mousedown',function(e){rawTap=Math.round(e.pageX)+','+Math.round(e.pageY)},true);
  document.addEventListener('touchend',function(e){
    var t=e.changedTouches&&e.changedTouches[0];
    if(t)onTap(t.clientX,t.clientY);
  },true);
  document.addEventListener('mousedown',function(e){onTap(e.clientX,e.clientY)},true);

  setInterval(function(){
    var L=[],c=findCircle();
    L.push('PT DIAG  screen '+screen.width+'x'+screen.height+'   inner '+window.innerWidth+'x'+window.innerHeight+'   dpr '+window.devicePixelRatio);
    if(c){
      var cont=c.getContainer(),s=c.getScreenCenter(),mp=c.m_menuScreenPos||null,ex='?';
      try{if(c.getMenuExtent)ex=Math.round(c.getMenuExtent())}catch(e){}
      var r=null;
      try{var _ce=cont.getEl?cont.getEl().dom:null;if(_ce)r=_ce.getBoundingClientRect()}catch(e4){}
      L.push('MENU  rad='+(c.m_radPercent||0)+'   center='+Math.round(s.x)+','+Math.round(s.y)+'   extent='+ex);
      L.push('  container '+Math.round(cont.getWidth())+'x'+Math.round(cont.getHeight())+' @ '+Math.round(cont.getLeft())+','+Math.round(cont.getTop()));
      L.push('  EKRANDA   '+Math.round(s.x+cont.getLeft())+','+Math.round(s.y+cont.getTop())+'   ( chegaralar 0..'+window.innerWidth+' , 0..'+window.innerHeight+' )');
      if(r)L.push('  KONTEYNER HAQIQIY '+Math.round(r.left)+','+Math.round(r.top)+'  '+Math.round(r.width)+'x'+Math.round(r.height));
      L.push('  parent     '+(c.m_parent?Math.round(c.m_parent.getWidth())+'x'+Math.round(c.m_parent.getHeight())+' @ '+Math.round(c.m_parent.getLeft())+','+Math.round(c.m_parent.getTop()):'null'));
      L.push('  touch      '+(mp?Math.round(mp.x)+','+Math.round(mp.y):'null'));
      L.push('  BARMOQ     '+rawTap);
      var bc=c.getButtonContainer?c.getButtonContainer():null;
      if(bc){
        L.push('  btnLayer   '+Math.round(bc.getWidth())+'x'+Math.round(bc.getHeight())+' @ '+Math.round(bc.getLeft())+','+Math.round(bc.getTop())+'   bolaklar: '+bc.items.getCount());
        var bg=c.getButtonContainerImageBG?c.getButtonContainerImageBG():null;
        if(bg){
          L.push('  DOIRA rasm '+Math.round(bg.getWidth())+'x'+Math.round(bg.getHeight())+' @ '+Math.round(bg.getLeft())+','+Math.round(bg.getTop()));
          try{
            var bel=bg.getEl?bg.getEl().dom:null;
            if(bel){
              var br=bel.getBoundingClientRect();
              L.push('  DOIRA HAQIQIY EKRANDA '+Math.round(br.left)+','+Math.round(br.top)+'  '+Math.round(br.width)+'x'+Math.round(br.height));
            }
          }catch(e2){}
        }
        var da=c.getDrawAreaContainer?c.getDrawAreaContainer():null;
        if(da)L.push('  drawArea   '+Math.round(da.getWidth())+'x'+Math.round(da.getHeight())+' @ '+Math.round(da.getLeft())+','+Math.round(da.getTop()));
      }
      L.push('TAP '+lastTap);
    }else{
      L.push('MENU: yopiq (hozir ko\'rinmayapti)');
      L.push('TAP '+lastTap);
    }
    box.textContent=L.join('\n');
  },500);
})();
</script>
